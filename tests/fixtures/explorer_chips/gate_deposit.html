<!--
Captured 2026-05-01 from https://etherscan.io/address/0x1c4b70a3968436b9a0a9cf5205c787eb81bb558c
via Playwright MCP. Demonstrates the mixed chip pattern: an entity-type chip
(plain <span class="badge bg-white">) plus a hashtag chip (anchor with
href="/accounts/label/<word>"). The parser must prefix "#" only to the latter.
-->
<!DOCTYPE html>
<html lang="en-US">
<head><title>Gate Deposit: 0x1c4b70a3968436b9a0a9cf5205c787eb81bb558c | Address: 0x1c4b70a3...b81bb558c | Etherscan</title></head>
<body>
<section id="ContentPlaceHolder1_divSummary">
  <div class="d-flex">
    <div class="d-flex">
      <div id="ContentPlaceHolder1_divLabels" class="d-flex gap-1">
        <span class="badge bg-white border border-dark dark:border-white border-opacity-15 text-dark text-nowrap fw-medium transition-all rounded-pill py-1.5 px-2">
          <div class="d-flex align-items-center gap-1">
            <span class="hash-tag text-truncate ">Exchange</span>
          </div>
        </span>
        <a class="badge bg-white hover:bg-secondary border border-dark dark:border-white border-opacity-15 text-dark text-nowrap fw-medium transition-all rounded-pill py-1.5 px-2"
           href="/accounts/label/gate">
          <div class="d-flex align-items-center gap-1">
            <i class="far fa-hashtag"></i>
            <span class="hash-tag text-truncate  lh-sm my-n1">Gate</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
</body>
</html>
