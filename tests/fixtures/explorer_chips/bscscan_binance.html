<!--
Captured 2026-05-01 from https://bscscan.com/address/0x8894e0a0c962cb723c1976a4421c95949be2d4e3
(Binance 51 hot wallet on BSC). Confirms divLabels selector is universal across
the Etherscan family. Note: BscScan tags BOTH "Binance" and "Exchange" as
hashtag-anchors (href="/accounts/label/...") — Etherscan only does that for
"Gate" — so the parser must rely on the href, not on which words are anchored.
-->
<!DOCTYPE html>
<html lang="en-US">
<head><title>Binance 51 | Address: 0x8894e0a0...49be2d4e3 | BscScan</title></head>
<body>
<section id="ContentPlaceHolder1_divSummary">
  <div class="d-flex">
    <div class="d-flex">
      <div id="ContentPlaceHolder1_divLabels" class="d-flex gap-1">
        <a class="badge bg-white hover:bg-secondary border border-dark dark:border-white border-opacity-15 text-dark text-nowrap fw-medium transition-all rounded-pill py-1.5 px-2"
           href="/accounts/label/binance">
          <div class="d-flex align-items-center gap-1">
            <i class="far fa-hashtag"></i>
            <span class="hash-tag text-truncate  lh-sm my-n1">Binance</span>
          </div>
        </a>
        <a class="badge bg-white hover:bg-secondary border border-dark dark:border-white border-opacity-15 text-dark text-nowrap fw-medium transition-all rounded-pill py-1.5 px-2"
           href="/accounts/label/exchange">
          <div class="d-flex align-items-center gap-1">
            <i class="far fa-hashtag"></i>
            <span class="hash-tag text-truncate  lh-sm my-n1">Exchange</span>
          </div>
        </a>
        <span class="badge bg-white border border-dark dark:border-white border-opacity-15 text-dark text-nowrap fw-medium transition-all rounded-pill py-1.5 px-2">
          <div class="d-flex align-items-center gap-1">
            <span class="hash-tag text-truncate ">Deposit Address</span>
          </div>
        </span>
      </div>
    </div>
  </div>
</section>
</body>
</html>
